<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 260" role="img" aria-label="Qumo">
  <!-- The Q from the wordmark, and only the Q.

       Not the wordmark itself: public/qumo.svg is 695 x 228 and a favicon
       is read at sixteen pixels across, where four letters is a grey
       smear. The Q carries the mark alone, and it is already square
       (232 x 228), which is why it survives the crop.

       Two blues, because an SVG favicon is one of the few images that gets
       to know what it has been dropped onto. Chrome and Firefox honour a
       media query inside it, so the glyph brightens on a dark tab strip
       where the console's own accent would sit at about 2.4:1 against the
       chrome - fine for a logo, better for one that can see the room. A
       browser that ignores the query gets the accent, which is the
       conservative half of the pair. -->
  <style>
    .q { fill: #2563eb; }
    @media (prefers-color-scheme: dark) { .q { fill: #60a5fa; } }
  </style>
  <g class="q" transform="translate(16 16)">
    <path d="M133.38,54.19c-39.09-12.04-77.61,16.14-81.09,55.89-3.28,37.44,26.69,69.22,65.06,66.5l38.48,41.11c-45.3,21.96-100.23,7.56-130.8-30C1.04,158.19-5.95,119.69,5.12,83.74,20.98,32.28,68.98-2.11,122.21.1c64.57,2.68,114.31,56.35,109.87,121.25-1.04,15.25-5.34,29.3-13.66,43.85l-42.41-43.01c4.52-30.2-12.99-58.87-42.64-68.01Z"/>
    <path d="M208.93,179.47c10.32,11.39,13.83,25.22,4.07,37.65-7.95,10.13-26.37,15.18-36.22,3.9l-43.8-50.14c-9.95-11.39-11.34-28.02.42-38.22,10.29-8.93,25.21-8.73,34.41,1.43l41.12,45.37Z"/>
  </g>
</svg>
